<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign In — DM Office West Tripura</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header Banner -->
  <header class="header-banner">
    <a href="index.html" class="emblem-link" title="Home - Citizen Feedback Portal">
      <span>🏛️</span>
    </a>
    <h1>DM & Collector, West Tripura</h1>
    <p>Admin Portal Sign In</p>
  </header>

  <div class="main-wrapper form-wrapper">
    <div class="card">
      <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-navy); margin-bottom: 6px;">Admin Sign In</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px;">Enter your authorized Gmail & Password (BDO / SDM / DM)</p>

      <div id="alertBox" class="alert"></div>

      <form id="loginForm">
        <div style="margin-bottom: 16px;">
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--primary-navy); display: block; margin-bottom: 6px;">Email / Gmail ID</label>
          <input type="email" id="email" placeholder="e.g. admin@gmail.com" required />
        </div>

        <div style="margin-bottom: 20px;">
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--primary-navy); display: block; margin-bottom: 6px;">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <button type="submit" id="submitBtn" class="btn btn-navy btn-full">Sign In</button>
      </form>

      <div style="display: flex; justify-content: space-between; margin-top: 20px; font-size: 0.88rem;">
        <a href="reset.html" style="color: var(--accent-gold); font-weight: 600; text-decoration: none;">Forgot password?</a>
        <a href="index.html" style="color: var(--primary-navy); font-weight: 600; text-decoration: none;">← Public Feedback Form</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div><strong>Office of the District Magistrate & Collector, West Tripura</strong></div>
    <div style="margin-top: 4px;">Designed by NIC West Tripura</div>
  </footer>

  <script src="app.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const alertBox = document.getElementById("alertBox");
      const submitBtn = document.getElementById("submitBtn");

      if (!email || !password) {
        alertBox.className = "alert alert-error";
        alertBox.textContent = "Please fill in all fields.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Authenticating...";
      alertBox.style.display = "none";

      const res = await apiPost("login", { email, password });

      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";

      if (res.success) {
        setAuthToken(res.token);
        saveUserInfo(res.email, res.role, res.office);
        alertBox.className = "alert alert-success";
        alertBox.textContent = "Login successful! Redirecting...";
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);
      } else {
        alertBox.className = "alert alert-error";
        alertBox.textContent = res.error || "Login failed. Please verify credentials.";
      }
    });
  </script>
</body>
</html>
